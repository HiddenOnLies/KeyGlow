name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: KeyGlow 0.2.0, OpenRGB 1.1, Windows 11, keyboard model
